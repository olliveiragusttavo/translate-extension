<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-width: 360px;
            background: #f4f7fb;
        }

        .app-shell {
            max-width: 560px;
            margin: 0 auto;
        }

        .app-header {
            background: linear-gradient(135deg, #0d6efd, #084298);
            color: #fff;
        }

        .app-header p {
            color: rgba(255, 255, 255, .78);
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        .result-box {
            min-height: 92px;
            white-space: pre-wrap;
        }

        #status {
            min-height: 24px;
        }

        @media (max-width: 420px) {
            body {
                min-width: 0;
            }
        }
    </style>
</head>
<body>
    <main class="app-shell p-3">

        <section class="bg-white">
            <div class="mb-3">
                <label class="form-label fw-semibold" for="source-text">Text to translate</label>
                <textarea class="form-control" id="source-text" placeholder="Type or paste text here"></textarea>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label class="form-label fw-semibold" for="source-language">From</label>
                    <select class="form-select" id="source-language">
                        <option value="auto">Detect language</option>
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                    </select>
                </div>

                <div class="col-6">
                    <label class="form-label fw-semibold" for="target-language">To</label>
                    <select class="form-select" id="target-language">
                        <option value="es">Spanish</option>
                        <option value="en">English</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-primary w-100 fw-semibold" id="translate-button" type="button">Translate</button>
            <p class="text-secondary small mt-2 mb-3" id="status" role="status"></p>

            <label class="form-label fw-semibold" for="result">Translation</label>
            <div class="result-box border rounded-2 bg-light p-3" id="result"></div>
        </section>
    </main>

    <script src="translator.js"></script>
</body>
</html>
